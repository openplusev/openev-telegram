services:
  openev-telegram:
    container_name: openev-telegram
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    env_file: .env
    volumes:
      - telegram-data:/app/data
    networks:
      - proxy

networks:
  proxy:
    external: true

volumes:
  telegram-data:
    name: opencapper-telegram_opencapper-telegram-data
